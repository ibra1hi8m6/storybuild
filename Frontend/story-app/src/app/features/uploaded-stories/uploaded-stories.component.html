<app-navbar />
<div class="stories-page" dir="rtl">
  <div class="page-header">
    <button class="back-btn" (click)="goBack()">← رجوع</button>
    <h1>📚 مكتبة القصص</h1>
    <p>اختر قصة واستمتع بالقراءة</p>
  </div>

  @if (isLoading()) {
    <div class="loading-center">
      <div class="spinner"></div>
      <p>جاري تحميل القصص...</p>
    </div>
  }

  @if (!isLoading() && stories().length === 0) {
    <div class="empty-state">
      <div class="empty-icon">📭</div>
      <p>لا توجد قصص متاحة حالياً</p>
    </div>
  }

  <div class="stories-grid">
    @for (s of stories(); track s.id) {
      <button class="story-card" (click)="open(s)" style="position:relative"
              [style.opacity]="s.isLocked ? '0.85' : '1'">

        @if (s.isLocked) {
          <div style="position:absolute;inset:0;background:rgba(255,255,255,.65);z-index:5;border-radius:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px">
            <span style="font-size:26px">🔒</span>
            <span style="font-size:12px;font-weight:800;color:#6B7280">مغلق</span>
            <span style="font-size:11px;font-weight:700;background:linear-gradient(135deg,#F4788A,#C084FC);color:#fff;padding:4px 12px;border-radius:99px">فعّل الاشتراك</span>
          </div>
        }

        <div class="cover-wrap">
          @if (s.coverImageUrl) {
            <img [src]="resolveImg(s.coverImageUrl)" [alt]="s.title" class="cover-img" />
          } @else {
            <div class="cover-placeholder">📕</div>
          }
        </div>
        <div class="card-body">
          <h3 class="story-name">{{ s.title }}</h3>
          <span class="page-badge">{{ s.pageCount }} صفحة</span>
        </div>
      </button>
    }
  </div>
</div>
