<div class="stories-page" dir="rtl">
  <div class="page-header">
    <h1>📚 مكتبة القصص</h1>
    <p>اختر قصة واستمتع بالقراءة</p>
  </div>

  @if (isLoading()) {
    <div class="loading-center">
      <div class="spinner"></div>
      <p>جاري تحميل القصص...</p>
    </div>
  }

  @if (!isLoading() && stories().length === 0) {
    <div class="empty-state">
      <div class="empty-icon">📭</div>
      <p>لا توجد قصص متاحة حالياً</p>
    </div>
  }

  <div class="stories-grid">
    @for (s of stories(); track s.id) {
      <button class="story-card" (click)="open(s.id)">
        <div class="cover-wrap">
          @if (s.coverImageUrl) {
            <img [src]="resolveImg(s.coverImageUrl)" [alt]="s.title" class="cover-img" />
          } @else {
            <div class="cover-placeholder">📕</div>
          }
        </div>
        <div class="card-body">
          <h3 class="story-name">{{ s.title }}</h3>
          <span class="page-badge">{{ s.pageCount }} صفحة</span>
        </div>
      </button>
    }
  </div>
</div>
