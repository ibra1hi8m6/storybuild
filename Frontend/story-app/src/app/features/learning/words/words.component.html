<app-navbar />
<div class="words-page" dir="rtl">
  <div class="page-header">
    <button class="back-btn" (click)="goBack()">← رجوع</button>
    <h1 class="page-title">الكلمات</h1>
  </div>

  <!-- Letter filter -->
  <div class="letter-filter">
    <button class="filter-btn" [class.active]="!selectedLetter()" (click)="selectLetter(null)">الكل</button>
    @for (l of letters(); track l) {
      <button class="filter-btn" [class.active]="selectedLetter() === l" (click)="selectLetter(l)">{{ l }}</button>
    }
  </div>

  @if (isLoading()) {
    <div class="loading-wrap"><div class="spinner-border text-primary"></div></div>
  } @else if (!filteredWords().length) {
    <div class="empty-state">لا توجد كلمات لهذا الحرف بعد.</div>
  } @else {
    <div class="words-grid">
      @for (w of filteredWords(); track w.id) {
        <button class="word-card" (click)="openWord(w)" style="position:relative"
                [style.opacity]="w.isLocked ? '0.85' : '1'">

          @if (!w.isLocked && state.isCompleted(w.id)) {
            <span style="position:absolute;top:8px;right:8px;width:22px;height:22px;background:#22C55E;border-radius:50%;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:1">✓</span>
          }

          @if (w.isLocked) {
            <div style="position:absolute;inset:0;background:rgba(255,255,255,.6);border-radius:inherit;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px">
              <span style="font-size:22px">🔒</span>
              <span style="font-size:11px;font-weight:800;color:#6B7280">مغلق</span>
              <span style="font-size:10px;font-weight:700;background:var(--primary-gradient,linear-gradient(135deg,#F4788A,#C084FC));color:#fff;padding:3px 10px;border-radius:99px">فعّل الاشتراك</span>
            </div>
          }

          @if (w.imagePath) {
            <img [src]="w.imagePath" class="word-img" [alt]="w.displayWord">
          } @else {
            <div class="word-placeholder">{{ w.displayWord }}</div>
          }
          <div class="word-text">{{ w.displayWord }}</div>
          <div class="word-letter">حرف {{ w.relatedLetter }}</div>
        </button>
      }
    </div>
  }
</div>
