<div class="journey-wrap" dir="rtl">

  <!-- Header -->
  <div class="journey-header">
    <button class="btn-back" (click)="goBack()">
      <i class="bi bi-arrow-right"></i>
    </button>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" [style.width.%]="progress()"></div>
    </div>
    <span class="page-counter">{{ pageIdx() + 1 }} / {{ totalPages() }}</span>
  </div>

  <!-- Loading -->
  @if (isLoading()) {
    <div class="loading-center">
      <div class="spinner-border text-primary" style="width:3rem;height:3rem"></div>
      <p class="mt-3 fw-bold">جارٍ تحميل القصة...</p>
    </div>
  }

  @if (!isLoading() && currentPage()) {
    <!-- Page image -->
    <div class="page-image-wrap">
      <img [src]="currentPage().imageUrl" [alt]="currentPage().sentence" class="page-image" />
    </div>

    <!-- Mode tabs -->
    <div class="mode-tabs">
      <button class="mode-tab" [class.active]="mode()==='listen'" (click)="setMode('listen')">
        <i class="bi bi-ear"></i> استمع
      </button>
      <button class="mode-tab" [class.active]="mode()==='read'" (click)="setMode('read')">
        <i class="bi bi-book-open"></i> اقرأ
      </button>
      <button class="mode-tab" [class.active]="mode()==='record'" (click)="setMode('record')">
        <i class="bi bi-mic"></i> سجّل
      </button>
    </div>

    <!-- Content area -->
    <div class="mode-content">

      @if (mode() === 'listen') {
        <app-listen-mode
          [sentence]="currentPage().sentence"
          (next)="setMode('read')">
        </app-listen-mode>
      }

      @if (mode() === 'read') {
        <div class="read-mode-panel">
          <p class="read-sentence">{{ currentPage().sentence }}</p>
          <p class="read-hint">اقرأ الجملة بصوت عالٍ، ثم سجّل نفسك!</p>
          <button class="btn-primary-pill" (click)="setMode('record')">
            <i class="bi bi-mic-fill me-2"></i> ابدأ التسجيل
          </button>
        </div>
      }

      @if (mode() === 'record') {
        <app-record-mode
          [sentence]="currentPage().sentence"
          [pageId]="currentPage().pageId"
          [pageType]="pageType()"
          (passed)="onRecordPassed()">
        </app-record-mode>
      }

    </div>
  }

</div>
